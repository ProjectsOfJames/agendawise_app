name: agendawise
description: Offline alarms, tasks and calendar with snooze challenges.
publish_to: 'none'
version: 0.2.0+2

environment:
  sdk: ^3.9.0

dependencies:
  flutter:
    sdk: flutter
  flutter_riverpod: ^3.0.3
  go_router: ^16.2.0
  drift: ^2.34.0
  drift_flutter: ^0.3.1
  uuid: ^4.5.1
  alarm: ^5.15.0
  flutter_local_notifications: ^22.3.3
  timezone: ^0.11.0
  flutter_timezone: ^5.1.1
  permission_handler: ^13.0.2
  file_picker: ^13.3.0
  path_provider: ^2.1.5
  sensors_plus: ^7.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0
  build_runner: ^2.7.0
  drift_dev: ^2.34.0

flutter:
  uses-material-design: true
  assets: 
    - assets/sounds/
